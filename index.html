<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#7bbf2e"/>
<title>Waafi Loans</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g:#7bbf2e;--gd:#5a9020;--gl:#f2f9e6;--gm:#e3f4c0;--gs:#f8fdf0;
  --t:#111827;--t2:#374151;--t3:#6b7280;--t4:#9ca3af;
  --b:#e5e7eb;--bg:rgba(123,191,46,.25);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:13px;--rl:16px;--rxl:24px;
}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;font-family:var(--font);background:var(--gs)}
.screen{display:flex;flex-direction:column;width:100%;height:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--gs);overflow:hidden;position:relative}

/* PAGE TRANSITION */
.screen{animation:pgIn .35s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen.leaving{animation:pgOut .25s ease forwards!important}
@keyframes pgOut{to{opacity:0;transform:translateY(-8px)}}

/* WHITE BAR */
.top-bar{background:#fff;padding:8px 16px;flex-shrink:0;border-bottom:1px solid #e8f5d8;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.logos-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.logo-w{height:52px;object-fit:contain;display:block}
.logo-s{height:38px;object-fit:contain;display:block}
.logo-sep{width:1px;height:32px;background:#d1e8b0;flex-shrink:0}
.bottom-row{display:flex;align-items:center;justify-content:space-between}
.brand-name{font-size:12px;font-weight:800;color:var(--gd)}
.chip{background:linear-gradient(135deg,#93cc3a,#5a9020);color:#fff;font-size:10px;font-weight:700;padding:4px 11px;border-radius:999px}

/* GREEN HEADER */
.header{background:linear-gradient(150deg,#93cc3a 0%,#7bbf2e 50%,#5a9020 100%);padding:10px 16px 12px;position:relative;overflow:hidden;flex-shrink:0}
.header::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07)1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07)1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.ga{position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(40px);top:-70px;right:-40px;pointer-events:none}
.hlabel{font-size:9px;color:rgba(255,255,255,.7);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;position:relative;z-index:1}
.hamount-row{display:flex;align-items:flex-end;gap:4px;margin-bottom:6px;position:relative;z-index:1}
.hcur{font-size:13px;font-weight:700;color:rgba(255,255,255,.75);margin-bottom:1px}
.hamt{font-size:30px;font-weight:800;color:#fff;line-height:1;font-family:var(--mono)}
.hpills{display:flex;gap:5px;flex-wrap:wrap;position:relative;z-index:1}
.hpill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 9px;font-size:9px;font-weight:700;color:#fff;font-family:var(--mono)}

/* BODY */
.body{flex:1;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* CARD */
.card{background:#fff;border:1px solid var(--b);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 8px rgba(123,191,46,.08)}
.cacc{height:3px;background:linear-gradient(90deg,#93cc3a,#7bbf2e,#a8d95a)}
.cb{padding:11px 14px}

/* FIELD */
.f{margin-bottom:10px}.f:last-child{margin-bottom:0}
.fl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}

/* SLIDERS */
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sn{font-size:12px;font-weight:700;color:var(--t);display:flex;align-items:center;gap:5px}
.sv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--gd);background:var(--gl);padding:2px 8px;border-radius:999px}
input[type=range]{width:100%;height:6px;border-radius:999px;appearance:none;outline:none;cursor:pointer;background:#e5e7eb}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:white;border:2.5px solid var(--g);cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.shint{display:flex;justify-content:space-between;font-size:9px;color:var(--t4);font-weight:600;margin-top:3px}

/* PAYMENT ROW */
.pay-row{display:flex;justify-content:space-between;align-items:center;background:var(--gl);border-radius:var(--r);padding:8px 12px;border:1px solid var(--bg);margin-top:6px}
.pay-lbl{font-size:11px;font-weight:700;color:var(--gd)}
.pay-val{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--g)}

/* INPUT */
.inp{width:100%;height:42px;padding:0 11px;border-radius:var(--r);border:1.5px solid var(--b);background:var(--gs);font-family:var(--mono);font-size:15px;font-weight:600;color:var(--t);outline:none;-webkit-appearance:none;transition:border-color .15s}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(123,191,46,.1);background:#fff}
.inp::placeholder{color:var(--t4);font-family:var(--font);font-size:13px;font-weight:400}

/* PHONE ROW */
.prow{display:flex;gap:7px}
.pfx{background:var(--gl);color:var(--gd);font-size:12px;font-weight:800;font-family:var(--mono);padding:0 10px;border-radius:var(--r);border:1.5px solid var(--bg);height:42px;display:flex;align-items:center;flex-shrink:0;gap:4px}

/* TWO COL */
.two{display:flex;gap:8px}.two .f{flex:1}

/* FOOTER */
.footer{flex-shrink:0;padding:8px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--gs) 70%,transparent)}
.fbtn{width:100%;padding:14px;border:none;border-radius:var(--r);background:linear-gradient(135deg,#93cc3a,#7bbf2e,#5a9020);color:#fff;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(123,191,46,.3)}
.fbtn:active{filter:brightness(.92);transform:scale(.98)}

/* MODAL */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:100}
.ov.open{display:flex}
.ms{background:#fff;width:100%;border-radius:var(--rxl) var(--rxl) 0 0;padding:0 0 28px;animation:up .22s ease;overflow:hidden}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:32px;height:4px;background:#e5e7eb;border-radius:2px;margin:10px auto 0}
.mhdr{padding:14px 18px 12px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:16px;font-weight:800;color:var(--t)}
.mx{width:26px;height:26px;border-radius:50%;background:#f3f4f6;border:none;font-size:12px;color:var(--t3);cursor:pointer}
.mb{padding:14px 18px}
.msub{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--t4);margin-bottom:10px}
.srows{background:#f9fafb;border-radius:var(--r);overflow:hidden;border:1px solid var(--b);margin-bottom:12px}
.sr{display:flex;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--b)}
.sr:last-child{border-bottom:none}
.srk{font-size:12px;color:var(--t3);font-weight:500}
.srv{font-size:12px;font-weight:700;color:var(--t)}
.stot{background:var(--gl);border-radius:var(--r);padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border:1px solid var(--bg)}
.stl{font-size:13px;font-weight:700;color:var(--gd)}
.stv{font-size:20px;font-weight:800;color:var(--g);font-family:var(--mono)}
.sact{display:flex;gap:9px}
.sc{flex:1;padding:12px;border-radius:var(--r);border:1.5px solid var(--b);background:transparent;font-family:var(--font);font-size:13px;font-weight:700;color:var(--t3);cursor:pointer}
.sp{flex:2;padding:12px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#93cc3a,#7bbf2e,#5a9020);font-family:var(--font);font-size:13px;font-weight:800;color:#fff;cursor:pointer}

/* TOAST */
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);background:#111827;color:white;padding:9px 16px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.22s ease;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="screen">

  <div class="top-bar">
    <div class="logos-row">
      <img src="assets/waafi.svg" alt="Waafi" class="logo-w">
      <div class="logo-sep"></div>
      <img src="assets/salaamlogo.webp" alt="Salaam" class="logo-s">
    </div>
    <div class="bottom-row">
      <span class="brand-name">Waafi Loans</span>
      <span class="chip"> Amaah Degdeg ah</span>
    </div>
  </div>

  <div class="header">
    <div class="ga"></div>
    <div class="hlabel">Xaddiga Amaahda</div>
    <div class="hamount-row">
      <span class="hcur">USD</span><span class="hamt" id="hAmt">300</span>
    </div>
    <div class="hpills">
      <span class="hpill" id="hDur">1 bilood</span>
      <span class="hpill" id="hMo">$0.00/bilood</span>
      <span class="hpill">Faa'iidada 2.5%/bil</span>
    </div>
  </div>

  <div class="body">
    <div class="card">
      <div class="cacc"></div>
      <div class="cb">

        <div class="f">
          <div class="sh">
            <div class="sn">💵 Xaddiga</div>
            <div class="sv" id="amtVal">$300</div>
          </div>
          <input type="range" id="amtSlider" min="300" max="12000" step="100" value="300" oninput="recalc()">
          <div class="shint"><span>$300</span><span>$12 000</span></div>
        </div>

        <div class="f">
          <div class="sh">
            <div class="sn">📅 Muddada</div>
            <div class="sv" id="durVal">1 bilood</div>
          </div>
          <input type="range" id="durSlider" min="1" max="24" step="1" value="1" oninput="recalc()">
          <div class="shint"><span>1 bilood</span><span>24 bilood</span></div>
        </div>

        <div class="pay-row">
          <span class="pay-lbl">Celinta Bishiiba</span>
          <span class="pay-val" id="payMo">$307.50</span>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="cacc"></div>
      <div class="cb">

        <div class="two">
          <div class="f">
            <div class="fl">Magaca Hore</div>
            <input class="inp" type="text" id="firstName" placeholder="Axmed">
          </div>
          <div class="f">
            <div class="fl">Magaca Dambe</div>
            <input class="inp" type="text" id="lastName" placeholder="Xasan">
          </div>
        </div>

        <div class="f">
          <div class="fl"> Lambarka Telefoonka</div>
          <div class="prow">
            <div class="pfx">+252</div>
            <input class="inp" type="tel" id="phone" inputmode="numeric" pattern="[0-9]*" placeholder="9XXXXXXXX">
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="footer">
    <button class="fbtn" onclick="openSummary()">Dib u eeg &amp; Codso →</button>
  </div>

  <div class="ov" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="ms">
      <div class="mh"></div>
      <div class="mhdr">
        <span class="mt">Kooban Amaahda</span>
        <button class="mx" onclick="closeModal()">✕</button>
      </div>
      <div class="mb">
        <div class="msub">Codsigaaga</div>
        <div class="srows" id="sumRows"></div>
        <div class="stot">
          <span class="stl">Celinta Bishiiba</span>
          <span class="stv" id="sumMo">$0.00</span>
        </div>
        <div class="sact">
          <button class="sc" onclick="closeModal()">Wax ka badal</button>
          <button class="sp" onclick="proceed()">Sii wad →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>
<script>
const RATE=0.025;
let loanAmt=300,loanDur=1;

function fill(el,c){const p=((el.value-el.min)/(el.max-el.min))*100;el.style.background=`linear-gradient(to right,${c} ${p}%,#e5e7eb ${p}%)`}

function recalc(){
  loanAmt=+document.getElementById("amtSlider").value;
  loanDur=+document.getElementById("durSlider").value;
  fill(document.getElementById("amtSlider"),"#7bbf2e");
  fill(document.getElementById("durSlider"),"#5a9020");
  const interest=loanAmt*RATE*loanDur,total=loanAmt+interest,mo=total/loanDur;
  const dur=loanDur+(loanDur===1?" bilood":" bilood");
  document.getElementById("amtVal").textContent="$"+loanAmt.toLocaleString("en-US");
  document.getElementById("durVal").textContent=dur;
  document.getElementById("hAmt").textContent=loanAmt.toLocaleString("en-US");
  document.getElementById("hDur").textContent=loanDur+" bilood";
  document.getElementById("hMo").textContent="$"+mo.toFixed(2)+"/bilood";
  document.getElementById("payMo").textContent="$"+mo.toFixed(2);
}

document.getElementById("phone").oninput=function(){
  let v=this.value.replace(/\D/g,"");
  if(v.startsWith("253"))v=v.slice(3);
  if(v.startsWith("0"))v=v.slice(1);
  this.value=v.slice(0,9);
};

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

function validate(){
  const fn=document.getElementById("firstName").value.trim();
  const ln=document.getElementById("lastName").value.trim();
  const ph=document.getElementById("phone").value.trim();
  if(!fn||!ln||!ph){toast("Fadlan buuxi dhammaan goobaha");return null}
  if(ph.length!==9){toast("Telefoonku waa inuu noqdaa 9 nambar");return null}
  const interest=loanAmt*RATE*loanDur,total=loanAmt+interest,mo=(total/loanDur).toFixed(2);
  return{firstName:fn,lastName:ln,phone:"+252"+ph,monthly:mo,totalRepay:total.toFixed(2)};
}

function openSummary(){
  const d=validate();if(!d)return;
  const dur=loanDur+" bilood";
  const fmt=n=>parseFloat(n).toLocaleString("en-US",{minimumFractionDigits:2});
  document.getElementById("sumRows").innerHTML=`
    <div class="sr"><span class="srk">Magaca</span><span class="srv">${d.firstName} ${d.lastName}</span></div>
    <div class="sr"><span class="srk">Telefoon</span><span class="srv">${d.phone}</span></div>
    <div class="sr"><span class="srk">Xaddiga</span><span class="srv">$${fmt(loanAmt)}</span></div>
    <div class="sr"><span class="srk">Muddada</span><span class="srv">${dur}</span></div>
    <div class="sr"><span class="srk">Wadarta La Celinta</span><span class="srv">$${fmt(d.totalRepay)}</span></div>
  `;
  document.getElementById("sumMo").textContent="$"+d.monthly;
  document.getElementById("modal").classList.add("open");
}

function closeModal(){document.getElementById("modal").classList.remove("open")}

function proceed(){
  const d=validate();if(!d)return;
  sessionStorage.setItem("selectedPlan",JSON.stringify({
    plan:"Prêt Waafi",loanAmount:loanAmt,duration:loanDur,
    monthlyRepayment:d.monthly,totalRepayable:d.totalRepay,
    firstName:d.firstName,lastName:d.lastName,phone:d.phone
  }));
  closeModal();navigateTo("login.html");
}

function navigateTo(url){document.querySelector('.screen').classList.add('leaving');setTimeout(()=>location.href=url,260)}

recalc();
</script>
</body>
</html>
